name: build-release-on-main-push

on:
  push:
    branches:
      - main

jobs:
  build-release-on-main-push:
    if: ${{ !contains(github.event.head_commit.message, '[release]') }} # prevent recursive releases

    permissions:
      contents: write
      packages: write

    strategy:
      max-parallel: 1 # otherwise the release upload will fail
      matrix:
        os: [macos-15, macos-15-intel, windows-latest, ubuntu-latest] # macos-15 is aarch_64, macos-15-intel is x86_64


    runs-on: ${{ matrix.os }}

    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: install-libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install libxtst-dev libharfbuzz-dev libgtk-3-dev libpango1.0-dev libatk1.0-dev libgl1-mesa-dev libx11-dev libfreetype6-dev libfontconfig1-dev

      - id: setup-graalvm
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: 'liberica'
          java-version: '21'
          java-package: 'jdk+fx'
          cache: 'maven'

      - id: show-paths
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version

      - id: maven-build-verify
        # the JavaFX tests need a display, which Linux runners only get from xvfb
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}mvn --batch-mode -Pnative-graalvm-default-liberica-nik -Dcreate-os-specific-archive clean package

      - id: native-smoke-check
        # a binary that builds but does not start has shipped before (F-27); catch that before release
        # no platform starts the GUI here: CI runners have no GPU, and the image's software
        # pipeline doesn't initialise either, so the GUI start is verified on a developer machine instead
        if: runner.os != 'Windows'
        run: |
          ./target/log-gazer --version

      - id: native-smoke-check-windows
        # a binary that builds but does not start has shipped before (F-27); catch that before release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\target\log-gazer.exe --version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "log-gazer --version exited with code $LASTEXITCODE"
            exit 1
          }

          # whether windows-latest can create a window is unverified; a false failure here would cancel the whole release

      - id: configure-git-user
        uses: qoomon/actions--setup-git@v1
        with:
          user: bot

      - id: get-version-from-pom
        uses: dostonhamrakulov/maven-artifact-version-extractor@v1.0
        with:
          file_path: ${{ github.workspace }}/pom.xml

      - id: get-latest-tag
        uses: WyriHaximus/github-action-get-previous-tag@v1

      - name: tag-version
        if: ${{ steps.get-version-from-pom.outputs.version != steps.get-latest-tag.outputs.tag}}
        uses: tvdias/github-tagger@v0.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.get-version-from-pom.outputs.version }}

      - id: create-release-notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ steps.get-version-from-pom.outputs.version }}
          files: |
            target/log-gazer*.tar.gz
            target/log-gazer*.zip

      - id: merge-main-to-dev
        run: |
          git checkout dev
          git pull
          git merge --no-ff main -m "[release] auto-merge released main back to dev"
          git push