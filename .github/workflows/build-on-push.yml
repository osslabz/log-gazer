name: build-on-push

on:
  push:
    branches-ignore:
      - main
  # Pushes made with GITHUB_TOKEN start no run, so the release and the Dependabot merge
  # dispatch this workflow on dev to build and publish what they pushed.
  workflow_dispatch:

concurrency:
  group: build-on-push-${{ github.ref }}
  # A newer push cancels an in-progress branch build; dev builds are never cancelled mid-run,
  # and a newer dev push replaces only an older pending run (which already covers its
  # predecessor's snapshot).
  cancel-in-progress: ${{ github.ref_name != 'dev' }}

jobs:
  # A build of its own rather than osslabz/github-actions build.yml: the JavaFX tests open real
  # windows, so Maven runs under xvfb. The two composite actions are the shared ones.
  build-on-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      # Full history for commit-subject-check. No persisted token: nothing in the build pushes.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: check-commit-subjects
        uses: osslabz/github-actions/commit-subject-check@v1
        with:
          default-branch: dev

      - name: setup-jdk
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          # On JDK 24+ Liberica NIK reports the image as dynamically linked, so AWT loads
          # libawt_lwawt.dylib next to the binary and the macOS app dies on start (F-27).
          # The release builds with NIK 21, and this build stays with it.
          java-version: 21
          distribution: 'temurin'
          cache: maven
          # A Dependabot branch's poms miss the cache, and the entry it would save is readable
          # from that branch only.
          cache-read-only: ${{ startsWith(github.ref_name, 'dependabot/') }}

      # After setup-jdk, which keys its Maven cache on the poms' contents: rewriting them
      # first would miss that cache on every branch but dev.
      - name: set-snapshot-version
        uses: osslabz/github-actions/snapshot-version@v1
        with:
          default-branch: dev

      # This one publishes to GitHub Packages rather than Central, so every branch publishes:
      # the Central limits that keep the other osslabz repos to dev do not apply here.
      # Dependabot's runs get a read-only token, so they verify instead.
      - name: maven-build-publish
        # the JavaFX tests need a display
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_GOAL: ${{ github.actor == 'dependabot[bot]' && 'verify' || 'deploy' }}
        run: xvfb-run -a ./mvnw --batch-mode --update-snapshots -Dmaven.install.skip=true "$MAVEN_GOAL"

      - name: shaded-jar-version
        run: java -jar target/log-gazer-*.jar --version